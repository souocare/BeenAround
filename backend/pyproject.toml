[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beenaround-backend"
version = "0.1.0"
description = "Self-hosted travel history API for BeenAround."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0,<3.0",
    "alembic",
    "pydantic-settings",
    "httpx",
    "argon2-cffi>=23.1,<27",
    "PyJWT>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyshp>=3.0,<4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
